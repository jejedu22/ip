expose_php = 0
memory_limit = 256M
; 5 pièces jointes de 5 Mo maximum
upload_max_filesize = 6M
post_max_size = 32M
max_file_uploads = 10
date.timezone = Europe/Paris

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Ne jamais afficher d'erreurs (le formulaire manipule des données sensibles)
display_errors = 0
log_errors = 1
error_log = /dev/stderr
